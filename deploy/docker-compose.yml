# 新平食品 P1 · 一键起服务
# 用法：cd 到项目根目录，然后  docker compose -f deploy/docker-compose.yml up -d
#
# 数据在命名卷 p1data 里（数据库 + 打卡照片 + 签名密钥）。
# 换机器只要把卷搬过去：docker run --rm -v p1data:/v -v ${PWD}:/b alpine tar czf /b/p1data.tgz -C /v .

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: xinping-p1:latest
    container_name: xinping-p1
    restart: unless-stopped
    environment:
      P1_ENV: prod
      P1_DATA: /data
      P1_PORT: "8765"
    volumes:
      - p1data:/data
    ports:
      # 只绑本机，让 Nginx 在前面收请求；要直接对外就改成 "8765:8765"
      - "127.0.0.1:8765:8765"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 可选：把 Nginx 也一起起来（需要域名和证书时用）
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   depends_on: [app]
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./certs:/etc/nginx/certs:ro

volumes:
  p1data:
