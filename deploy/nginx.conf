# 新平食品 P1 · Nginx 反向代理
# 放到 /etc/nginx/conf.d/xinping.conf
# 作用：收 HTTPS、转给 127.0.0.1:8765、管上传大小、给静态资源加缓存

upstream p1_backend {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 80;
    server_name p1.example.com;

    # 只做跳转，不做业务
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name p1.example.com;

    # 证书：certbot 会自动放到这两个路径
    ssl_certificate     /etc/letsencrypt/live/p1.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p1.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 打卡照片最大 4MB，留点余量
    client_max_body_size 8m;
    client_body_timeout  60s;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 上传的图片走长缓存
    location /uploads/ {
        proxy_pass http://p1_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://p1_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/xinping.access.log;
    error_log  /var/log/nginx/xinping.error.log warn;
}
